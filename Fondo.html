<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuatro párrafos con estilos</title>
  <style>
    body {
      background: aqua;
      font-family: verdana;
      font-size: 20px;
      color: blue;
      text-align: center;
    }

    .plata {
      background: silver;
    }

    .derecha {
      text-align: right;
      color: blue;
      font-size: 28px;
    }

     .rojo {
      color: red;
    }
  </style>
</head>
<body>
  <p>Texto <span class="rojo">centrado.</span> </p>
  <p class="plata">Texto centrado sobre fondo de color plata.</p>
  <p class="derecha">Texto <span class="rojo">alineado</span> a la derecha.</p>
  <p class="plata">Otro texto centrado sobre fondo de color plata.</p>
