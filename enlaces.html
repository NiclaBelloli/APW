<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas de Enlaces</title>
  <style>
    /* Fondo de la página */
    body {
      background-color: yellow;
      font-family: Arial, sans-serif;
    }

    /* Título centrado y en color naranja */
    h1 {
      text-align: center;
      color: orange;
    }

    /* Estilo para los enlaces no visitados */
    a:link {
      color: red;
      text-decoration: underline;
    }

    /* Estilo cuando el puntero pasa sobre el enlace (hover) */
    a:hover {
      color: green;
      text-decoration: none;
    }

    /* Estilo para los enlaces ya visitados */
    a:visited {
      color: purple;
    }

    /* Estilo para el enlace activo (mientras se hace clic) */
    a:active {
      color: lime;
    }
  </style>
</head>
<body>

  <h1>Listas de enlaces</h1>

  <ul>
    <li>Buscadores
      <ul>
        <li><a href="http://www.bing.com/" target="_blank">Bing</a></li>
        <li><a href="http://www.google.com/" target="_blank">Google</a></li>
      </ul>
    </li>

    <li>Redes sociales
      <ul>
        <li><a href="http://www.facebook.com/" target="_blank">Facebook</a></li>
        <li><a href="http://www.twitter.com/" target="_blank">Twitter</a></li>
      </ul>
    </li>
  </ul>

</body>
</html>
