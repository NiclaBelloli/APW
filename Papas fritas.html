<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta de patatas fritas</title>

    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
            font-size: 20px;
        }

        h2 {
            color: #666;
            font-size: 16px;
        }

        p, li {
            color: #000;
            font-size: 12px;
        }

        img {
            width: 300px;
            height: 225px;
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Patatas fritas</h1>
    <p>Receta de patatas fritas caseras.</p>

    <img src="presentacion-de-las-patatas-fritas-en-freidora-de-aire.jpg
">
    <h2>Ingredientes</h2>
    <ul>
        <li>3 ó 4 patatas (300g.)</li>
        <li>4 dientes de ajo</li>
        <li>Aceite de oliva</li>
        <li>Sal</li>
    </ul>

    <h2>Elaboración (Pasos)</h2>
    <ol>
        <li>Calentar aceite en una sartén.</li>
        <li>Añadir las patatas cortadas, la sal y los ajos.</li>
        <li>Freír al gusto.</li>
        <li>Servir en plato.</li>
    </ol>
</body>
</html>
